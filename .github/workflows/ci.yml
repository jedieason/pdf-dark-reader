name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check source syntax
        run: |
          node --check scripts/build.mjs
          node --check src/popup.mjs
          node --check src/theme-bridge.mjs
      - name: Run tests
        run: npm test
